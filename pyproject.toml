[project]
name = "plot5d"
version = "0.1.0"
description = "Plot multi-dimensional data from csv!"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dash>=2.18.2",
    "flask-assets>=2.1.0",
    "flask>=3.0.3",
    "loguru>=0.7.3",
    "numpy>=2.2.1",
    "pandas>=2.2.3",
    "dash-mantine-components>=0.15.2",
    "dash-iconify>=0.1.2",
    "dash-ag-grid>=31.3.0",
    "click>=8.1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
plot5d = "plot5d.main:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "N801",    # I favor ICSBEP nomenclature clarity over python naming conventions.
    "N999",    # See N801
    "D100",    # Module documentation is self evident in most of ICONIQE.
    "PLR0915", # Material functions always break this.
    "PLR2004",
    "PLR0911",
    "PLR0913",
    "C901"
]
