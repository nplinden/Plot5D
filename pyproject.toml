[project]
name = "plot5d"
version = "0.1.0"
description = "Plot multi-dimensional data from csv!"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dash>=2.18.2",
    "flask-assets>=2.1.0",
    "flask>=3.0.3",
    "loguru>=0.7.3",
    "numpy>=2.2.1",
    "pandas>=2.2.3",
    "dash-mantine-components>=0.15.2",
    "dash-iconify>=0.1.2",
    "dash-ag-grid>=31.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
plot5d = "plot5d.main:main"

[[tool.uv.index]]
url = "http://wiki.xamr.local/wheels"

[tool.ruff]
line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"
